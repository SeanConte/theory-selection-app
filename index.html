<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Selection Suite v4.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap');

:root {
  --sky:        #e4f0ec;
  --paper:      #f5f0e8;
  --paper2:     #ede6d6;
  --paper3:     #e0d6c2;
  --white:      #fff;
  --leaf-dark:  #2d6a2d;
  --leaf-mid:   #4a9040;
  --leaf-light: #6db85c;
  --flower:     #e8a030;
  --red-soft:   #c05030;
  --red-pale:   #e07050;
  --slate:      #3a5a7a;
  --rose:       #a03050;
  --ink:        #2c2015;
  --ink-mid:    #5a4530;
  --ink-soft:   #8a7055;
  --ink-pale:   #b8a888;
  --shadow:     rgba(44,32,21,0.10);
  --shadow2:    rgba(44,32,21,0.20);
  /* tiers */
  --gold:       #b87800;
  --gold-bg:    #fff8e8;
  --gold-bd:    #e8c860;
  --silver:     #607088;
  --silver-bg:  #f0f2f6;
  --silver-bd:  #a8b8c8;
  --bronze:     #8a5020;
  --bronze-bg:  #f8f0e8;
  --bronze-bd:  #c8a070;
  /* silhouette */
  --sil:        #1e2a42;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--sky);
  background-image:
    radial-gradient(ellipse at 15% 0%,  rgba(255,255,255,0.55) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 100%, rgba(160,210,175,0.25) 0%, transparent 50%);
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 15px;
  min-height: 100vh;
}

.app { max-width: 1260px; margin: 0 auto; padding: 18px 22px; }
.screen { display: none; }
.screen.active { display: block; }

/* ── Header ── */
.app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 2px solid var(--paper3); }
.app-header-icon { font-size: 22px; cursor: pointer; }
.app-header h1 { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 18px; font-weight: 600; color: var(--leaf-dark); cursor: pointer; }
.breadcrumb { font-size: 13px; color: var(--ink-soft); }
.breadcrumb::before { content:'›'; margin: 0 6px; color: var(--ink-pale); }
.version { font-size: 11px; color: var(--ink-pale); margin-left: 4px; }
.seed-tag { font-size: 12px; color: var(--ink-pale); background: var(--paper2); padding: 4px 10px; border-radius: 20px; display: none; }
.settings-btn { background: none; border: 1px solid var(--paper3); font-size: 13px; font-family: inherit; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background 0.15s; color: var(--ink-soft); line-height: 1; margin-left: auto; }
.settings-btn:hover { background: var(--paper2); }

/* ── Shared components ── */
.card { background: var(--paper); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow), 0 0 0 1px var(--paper3); padding: 20px 22px; margin-bottom: 20px; }
.section-label { font-size: 11px; font-weight:600; color: var(--leaf-mid); margin-bottom: 12px; }
.btn { background: var(--paper2); border: 2px solid var(--paper3); border-radius: 8px; color: var(--ink-mid); padding: 8px 16px; cursor: pointer; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; font-weight:600; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
.btn:hover { background: var(--paper); border-color: var(--leaf-mid); color: var(--leaf-dark); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
.btn.primary { background: var(--leaf-mid); border-color: var(--leaf-dark); color: var(--white); font-weight:600; }
.btn.primary:hover { background: var(--leaf-dark); }
.btn.primary:disabled { background: var(--ink-pale); border-color: var(--ink-pale); }
.text-input { background: var(--white); border: 2px solid var(--paper3); border-radius: 8px; color: var(--ink); padding: 8px 12px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; width: 180px; outline: none; transition: border-color 0.15s; }
.text-input:focus { border-color: var(--leaf-mid); }
.premise { background: linear-gradient(135deg,#eef6ee,#e8f4e8); border-radius: 10px; border: 1px solid #c4dcc4; padding: 16px 18px; font-size: 13px; line-height: 1.7; color: var(--ink-mid); margin-bottom: 20px; }
.premise strong { color: var(--leaf-dark); }
.premise p + p { margin-top: 8px; }
.notif { border-radius: 10px; padding: 11px 16px; font-size: 13px; line-height: 1.65; color: var(--ink-mid); display: none; margin-bottom: 14px; border: 1px solid var(--paper3); background: var(--paper); }
.notif.vis  { display: block; }
.notif.good { background: linear-gradient(135deg,#eef6ee,#e8f4e8); border-color: #a0c8a0; }
.notif.warn { background: linear-gradient(135deg,#fdf0ec,#f8e8e4); border-color: #e0b0a0; }
.hl { color: var(--leaf-dark); font-weight:600; }
.alert-txt { color: var(--red-soft); font-weight:600; }
.stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
.stat-box  { background: var(--paper); border-radius: 12px; box-shadow: 0 2px 8px var(--shadow); padding: 16px 10px; text-align: center; }
.stat-v    { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 26px; color: var(--leaf-mid); font-weight: 600; }
.stat-l    { font-size: 10px; font-weight:600; color: var(--ink-pale); margin-top: 3px; }
.reflect { background: linear-gradient(135deg,#fdf8ee,#f8f0d8); border: 1px solid #ddd0a8; border-left: 4px solid var(--flower); border-radius: 10px; padding: 16px 20px; font-size: 13px; line-height: 1.75; color: var(--ink-mid); margin-bottom: 20px; }
.reflect strong { color: #7a5010; font-size: 13px; font-weight:600; display: block; margin-bottom: 7px; }
.modal-bg { position: fixed; inset: 0; background: rgba(44,32,21,0.45); display: none; align-items: center; justify-content: center; z-index: 400; backdrop-filter: blur(2px); }
.modal-bg.vis { display: flex; }
.modal { background: var(--paper); border-radius: 16px; box-shadow: 0 12px 48px var(--shadow2); padding: 26px 28px; max-width: 480px; width: 92%; }
.modal h2 { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 18px; color: var(--leaf-dark); margin-bottom: 12px; }
.modal p { font-size: 13px; line-height: 1.7; color: var(--ink-mid); margin-bottom: 9px; }
.modal p strong { color: var(--leaf-dark); }
.modal-btns { display: flex; gap: 10px; margin-top: 14px; }
.settings-overlay { position: fixed; inset: 0; z-index: 499; display: none; }
.settings-overlay.open { display: block; }
.settings-panel { position: fixed; top: 0; right: -300px; width: 280px; height: 100vh; background: var(--paper); border-left: 2px solid var(--paper3); box-shadow: -4px 0 24px var(--shadow2); z-index: 500; transition: right 0.25s ease; display: flex; flex-direction: column; }
.settings-panel.open { right: 0; }
.settings-hdr { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 14px; border-bottom: 1px solid var(--paper3); }
.settings-hdr h2 { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 16px; font-weight: 600; color: var(--leaf-dark); }
.settings-x { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--ink-soft); padding: 2px 5px; border-radius: 4px; }
.settings-x:hover { background: var(--paper2); }
.settings-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
.settings-group { margin-bottom: 22px; }
.settings-group-lbl { font-size: 10px; font-weight:600; color: var(--ink-pale); margin-bottom: 10px; }
.settings-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--paper3); }
.settings-item:last-child { border-bottom: none; }
.settings-item-lbl { flex: 1; font-size: 13px; color: var(--ink-mid); }

/* ── Landing ── */
.land-hero { max-width: 720px; margin: 0 auto; padding: 36px 0 28px; text-align: center; }
.land-eyebrow { display: inline-block; font-size: 11px; font-weight:600; color: var(--leaf-mid); background: rgba(74,144,64,0.10); border: 1px solid rgba(74,144,64,0.25); border-radius: 20px; padding: 4px 14px; margin-bottom: 18px; }
.land-h1 { font-family: 'IBM Plex Serif', Georgia, serif; font-size: clamp(26px,3.6vw,36px); font-weight:500; line-height: 1.25; color: var(--ink); margin-bottom: 16px; }
.land-h1 em { font-style: normal; color: var(--leaf-dark); }
.land-sub { font-size: 15px; line-height: 1.75; color: var(--ink-mid); max-width: 520px; margin: 0 auto 28px; }
.land-divider { width: 50px; height: 3px; margin: 0 auto 36px; background: linear-gradient(90deg,var(--leaf-mid),var(--flower)); border-radius: 2px; }
.land-modules { max-width: 960px; margin: 0 auto; padding: 0 24px 48px; display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 20px; }
.mod-card { background: var(--paper); border-radius: 16px; box-shadow: 0 3px 18px var(--shadow), 0 0 0 1px var(--paper3); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.18s,box-shadow 0.18s; position: relative; animation: fadein 0.4s ease-out both; }
.mod-card:nth-child(1){animation-delay:0.05s}.mod-card:nth-child(2){animation-delay:0.12s}.mod-card:nth-child(3){animation-delay:0.19s}
.mod-card:not(.locked):hover { transform: translateY(-4px); box-shadow: 0 10px 32px var(--shadow2), 0 0 0 1px var(--paper3); }
.mod-card.locked { opacity: 0.70; }
.mod-art { height: 150px; position: relative; overflow: hidden; }
.art-pattern { background: linear-gradient(160deg,#2a3848,#3a5068 60%,#4a6078); }
.art-pattern-inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.art-garden { background: linear-gradient(180deg,#a8d8f0 0%,#c8ecf4 38%,#b8e870 68%,#7a9e38 100%); }
.art-sun { position: absolute; top: 12px; right: 18px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle,#ffe090,#ffb830); box-shadow: 0 0 16px #ffb83070; }
.art-plants { position: absolute; bottom: 0; left: 0; right: 0; display: flex; align-items: flex-end; justify-content: center; gap: 6px; padding: 0 14px 6px; }
.art-outbreak { background: linear-gradient(160deg,#1e1a2a,#2e2840 60%,#3a3050); }
.art-map { position: absolute; inset: 0; }
.art-map-dot { position: absolute; border-radius: 50%; }
.art-map-dot.sick { background: rgba(200,100,80,0.75); box-shadow: 0 0 8px rgba(200,100,80,0.5); animation: pulse-dot 2s ease-in-out infinite; }
.art-map-dot.well { background: rgba(80,160,100,0.55); }
@keyframes pulse-dot { 0%,100%{transform:scale(1);opacity:0.7} 50%{transform:scale(1.35);opacity:1} }
.lock-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.42); color: rgba(255,255,255,0.82); font-size: 10px; font-weight:600; padding: 3px 9px; border-radius: 12px; }
.mod-body { padding: 18px 20px 20px; flex: 1; display: flex; flex-direction: column; }
.mod-tag  { font-size: 10px; font-weight:600; margin-bottom: 7px; }
.mod-card:nth-child(1) .mod-tag { color: var(--slate); }
.mod-card:nth-child(2) .mod-tag { color: var(--leaf-mid); }
.mod-card:nth-child(3) .mod-tag { color: var(--rose); }
.mod-title { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 19px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.mod-desc  { font-size: 12px; color: var(--ink-soft); line-height: 1.65; margin-bottom: 14px; flex: 1; }
.mod-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.mod-pill  { font-size: 10px; font-weight:600; padding: 3px 9px; border-radius: 20px; background: var(--paper2); color: var(--ink-soft); }
.mod-pill.avail { background: rgba(74,144,64,0.12); color: var(--leaf-dark); }
.mod-btn   { display: block; width: 100%; padding: 11px 16px; border-radius: 10px; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; font-weight:600; text-align: center; cursor: pointer; border: none; transition: all 0.15s; }
.mod-btn.go { background: var(--leaf-mid); color: var(--white); }
.mod-btn.go:hover { background: var(--leaf-dark); }
.mod-btn.soon { background: var(--paper2); color: var(--ink-pale); cursor: default; }
.land-footer { text-align: center; padding: 24px; font-size: 11px; color: var(--ink-pale); border-top: 1px solid var(--paper3); }

/* ── Setup ── */
.setup-wrap { max-width: 580px; margin: 0 auto; padding-top: 8px; }
.setup-title { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 26px; font-weight: 600; color: var(--leaf-dark); margin-bottom: 6px; }
.setup-sub   { color: var(--ink-soft); font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
.diff-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.diff-btn  { background: var(--paper2); border: 2px solid var(--paper3); border-radius: 10px; padding: 14px 10px; cursor: pointer; text-align: center; transition: all 0.15s; color: var(--ink-soft); }
.diff-btn:hover { border-color: var(--leaf-mid); background: var(--paper); }
.diff-btn.sel { background: var(--white); border-color: var(--leaf-mid); color: var(--leaf-dark); box-shadow: 0 2px 8px var(--shadow); }
.diff-btn .dn { font-size: 14px; font-weight:600; margin-bottom: 3px; }
.diff-btn .dd { font-size: 11px; opacity: 0.72; line-height: 1.45; }

/* ════════════════════════════════════════
   PATTERN FINDER GAME LAYOUT
   ════════════════════════════════════════ */
.pf-layout { display: grid; grid-template-columns: 1fr 304px; gap: 20px; align-items: start; }

/* Status bar */
.pf-status { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 9px 14px; background: var(--paper); border-radius: 10px; box-shadow: 0 1px 6px var(--shadow); margin-bottom: 14px; font-size: 13px; }
.si { color: var(--ink-soft); }
.si strong { color: var(--ink); }

/* Tier badge */
.tier-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight:600; border: 2px solid; white-space: nowrap; }
.tier-badge.gold   { background: var(--gold-bg);   border-color: var(--gold-bd);   color: var(--gold);   }
.tier-badge.silver { background: var(--silver-bg); border-color: var(--silver-bd); color: var(--silver); }
.tier-badge.bronze { background: var(--bronze-bg); border-color: var(--bronze-bd); color: var(--bronze); }

/* Target area */
.target-area {
  background: var(--paper); border-radius: 14px;
  box-shadow: 0 3px 16px var(--shadow), 0 0 0 1px var(--paper3);
  padding: 16px 18px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 20px;
}
.target-silhouette { flex-shrink: 0; position: relative; }
.target-label { flex: 1; }
.target-label h3 { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.target-label p  { font-size: 12px; color: var(--ink-soft); line-height: 1.55; }
.target-knowns { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
.known-tag { font-size: 10px; font-weight:600; padding: 2px 8px; border-radius: 12px; background: rgba(74,144,64,0.12); color: var(--leaf-dark); border: 1px solid rgba(74,144,64,0.25); }

/* Silhouette animation */
@keyframes sil-breathe { 0%,100%{opacity:0.85;transform:scale(1)} 50%{opacity:1;transform:scale(1.03)} }
.sil-svg { animation: sil-breathe 3s ease-in-out infinite; }

/* Board */
.pf-board-card { background: var(--paper); border-radius: 14px; box-shadow: 0 3px 16px var(--shadow), 0 0 0 1px var(--paper3); padding: 14px 16px; margin-bottom: 14px; }
.pf-board-label { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px; }
.pf-board { display: flex; flex-wrap: wrap; gap: 6px; }

/* Creature card */
.c-card {
  background: var(--paper2); border-radius: 10px; border: 2px solid var(--paper3);
  padding: 6px 5px 5px; cursor: pointer; transition: all 0.18s;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  position: relative;
}
.c-card:hover:not(.eliminated) { border-color: var(--leaf-mid); background: var(--white); transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); }
.c-card.eliminated { opacity: 0.22; filter: grayscale(0.8) brightness(1.05); cursor: default; transition: opacity 0.4s, filter 0.4s; }
.c-card.eliminated:hover { transform: none; box-shadow: none; border-color: var(--paper3); background: var(--paper2); }
.c-card.target-reveal { border-color: var(--flower); box-shadow: 0 0 0 3px rgba(232,160,48,0.35); background: #fdf8ee; animation: winner-pulse 0.6s ease-out; }
.c-card.guess-live:hover { border-color: var(--flower); background: #fdf8ee; }
.c-name { font-size: 10px; font-weight:600; color: var(--ink-soft); }
@keyframes winner-pulse { 0%{transform:scale(0.95)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
@keyframes wrong-flash  { 0%,100%{border-color:var(--paper3)} 40%{border-color:var(--red-soft);background:#fdf0ec} }

/* ════════════════════════════════════════
   QUESTION PANEL (sidebar)
   ════════════════════════════════════════ */
.pf-sidebar-card { background: var(--paper); border-radius: 12px; box-shadow: 0 2px 10px var(--shadow); padding: 13px 15px; margin-bottom: 12px; }
.pf-sidebar-title { font-family: 'IBM Plex Serif', Georgia, serif; font-size: 14px; font-weight: 600; color: var(--leaf-dark); margin-bottom: 10px; }

/* Two-step question picker */
.q-step { display: none; }
.q-step.active { display: block; }

.q-step-label { font-size: 10px; font-weight:600; color: var(--ink-pale); margin-bottom: 8px; }

/* Step 1: property buttons */
.q-prop-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; margin-bottom: 4px;
  background: var(--paper2); border: 2px solid var(--paper3);
  border-radius: 8px; cursor: pointer; font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 12px; font-weight:600; color: var(--ink-mid);
  transition: all 0.12s; text-align: left;
}
.q-prop-btn:hover:not(.exhausted) { border-color: var(--leaf-mid); color: var(--leaf-dark); background: var(--paper); }
.q-prop-btn.exhausted { opacity: 0.35; cursor: not-allowed; }
.q-prop-btn .q-prop-icon { font-size: 13px; }
.q-prop-btn .q-prop-count { margin-left: auto; font-size: 9px; color: var(--ink-pale); font-weight: 600; }

/* Step 2: value pills */
.q-val-back { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 11px; color: var(--ink-soft); cursor: pointer; }
.q-val-back:hover { color: var(--leaf-dark); }
.q-val-prop-header { font-size: 13px; font-weight:600; color: var(--ink); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.q-vals { display: flex; flex-direction: column; gap: 5px; }
.q-val-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-radius: 8px; border: 2px solid var(--paper3);
  background: var(--paper2); cursor: pointer; font-size: 12px; font-weight:600;
  color: var(--ink-mid); transition: all 0.12s;
}
.q-val-row:hover:not(.answered) { border-color: var(--leaf-mid); color: var(--leaf-dark); background: var(--paper); }
.q-val-row.answered-yes { background: rgba(74,144,64,0.1);  border-color: var(--leaf-mid); color: var(--leaf-dark); cursor: default; }
.q-val-row.answered-no  { background: rgba(192,80,48,0.07); border-color: var(--red-soft);  color: var(--red-soft);  cursor: default; opacity: 0.6; }
.q-val-row .q-val-elim  { font-size: 9px; color: var(--ink-pale); font-weight: 600; }

/* Easy mode: just property buttons, no step 2 */
.q-easy-note { font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; line-height: 1.5; }

/* Guess section */
.q-guess-area { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--paper3); }
.q-guess-link { font-size: 11px; color: var(--ink-soft); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.q-guess-link:hover { color: var(--leaf-dark); }
.q-guess-prompt { font-size: 12px; color: var(--ink-mid); margin-bottom: 6px; display: none; }
.q-guess-prompt.vis { display: block; }

/* Log */
.a-entry { display: flex; align-items: flex-start; gap: 7px; padding: 6px 0; border-bottom: 1px solid var(--paper3); font-size: 11px; } const allScores=S.cells.flat().filter(c=>c.history.length>0).map(c=>c.history[c.history.length-1].score); if(!allScores.length) return 'Try assigning different conditions to different regions so you can compare them side by side.'; const spread=Math.max(...allScores)-Math.min(...allScores); if(spread<15) return 'This garden looks fairly flat. Try changing one condition at a time across larger regions so small differences become easier to notice.'; if(S.topHeight>S.goal.height*0.82) return `You were close (best height: ${Math.round(S.topHeight)}). Next time, commit to your strongest combination earlier and let the compounding growth work for you.`; return 'Try creating clearer side-by-side tests. When two regions differ in exactly one condition, it becomes much easier to see which variable is doing the work.'; }
  return { goSetup, start, retry, randSeed, runDay, clearSel };
})();

const Outbreak = (() => {

  /* ── Disease definitions ─────────────────────────────────
     Parameters:
       radius:      transmission proximity threshold (px)
       rate:        probability of transmission per tick when in range
       incubation:  days before symptomatic
       immunity:    whether recovery grants immunity
  */
  const DISEASES = [
    { id:'blotch',   name:'Blotch Fever',   color:'#e05050', radius:55, rate:0.018, incubation:2, immunity:false, desc:'Wide radius · high rate · short incubation · no immunity' },
    { id:'greymist', name:'Greymist',        color:'#9090b8', radius:20, rate:0.005, incubation:7, immunity:true,  desc:'Tight radius · low rate · long incubation · immunity' },
    { id:'crumble',  name:'Crumble',         color:'#e0a040', radius:40, rate:0.020, incubation:4, immunity:true,  desc:'Medium radius · high rate · medium incubation · immunity' },
    { id:'driftlung',name:'Driftlung',       color:'#60a8c0', radius:55, rate:0.004, incubation:7, immunity:false, desc:'Wide radius · low rate · long incubation · no immunity' },
    { id:'spindle',  name:'Spindlefever',    color:'#c060a0', radius:18, rate:0.025, incubation:2, immunity:true,  desc:'Tight radius · high rate · short incubation · immunity' },
    { id:'hollow',   name:'Hollow Rot',      color:'#80b060', radius:38, rate:0.010, incubation:4, immunity:false, desc:'Medium radius · medium rate · medium incubation · no immunity' },
  ];

  const CONFIGS = {
    easy:   { agentCount:40, diseases:['blotch','greymist','crumble','spindle'],              actions:12 },
    medium: { agentCount:60, diseases:['blotch','greymist','crumble','driftlung','spindle','hollow'], actions:10 },
    hard:   { agentCount:80, diseases:['blotch','greymist','crumble','driftlung','spindle','hollow'], actions:8  },
  };

  // Tiers: gold ≤ 4 actions, silver ≤ 7, bronze > 7
  function _tier(actionsUsed) { return actionsUsed<=4?'gold':actionsUsed<=7?'silver':'bronze'; }
  function _tierLabel(t)       { return t==='gold'?'🥇 Sharp':t==='silver'?'🥈 Good':'🥉 Diagnosed'; }

  // Canvas dimensions
  const CW = 680, CH = 420;
  const TICK_MS = 40; // ms per simulation tick
  const TICKS_PER_DAY = 25; // simulation ticks per game day
  const AGENT_R = 5;    // agent radius px
  const AGENT_SPEED = 1.2;

  // Colours for rendering
  const C_HEALTHY   = '#6aaa5a';
  const C_INCUBATE  = '#e8c84a'; // shown only on reveal/test
  const C_SYMPTOM   = '#e06040';
  const C_RECOVERED = '#7080b0';
  const C_FOLLOW_RING = 'rgba(255,255,255,0.9)';
  const C_QZONE = 'rgba(200,80,40,0.18)';
  const C_QZONE_BORDER = 'rgba(200,80,40,0.7)';

  let S = {};       // game state
  let _raf = null;  // requestAnimationFrame handle
  let _lastTick = 0;
  let _playing = false;
  let _speed = 1;
  let _tool = 'observe';
  let _dragStart = null; // for quarantine drag
  let _dragCur   = null;
  let _selectedDisease = null;

  /* ── State init ────────────────────────────────────────── */
  function _freshState(diff, seedStr) {
    const cfg = CONFIGS[diff];
    const rng  = App.mulberry32(App.seedFromStr(seedStr));

    // Pick which disease is actually spreading
    const diseasePool = cfg.diseases.map(id=>DISEASES.find(d=>d.id===id));
    const actual = diseasePool[Math.floor(rng() * diseasePool.length)];

    // Generate agents
    const agents = [];
    for (let i=0;i<cfg.agentCount;i++) {
      const x = AGENT_R*2 + rng()*(CW-AGENT_R*4);
      const y = AGENT_R*2 + rng()*(CH-AGENT_R*4);
      const angle = rng()*Math.PI*2;
      agents.push({
        id: i,
        x, y,
        vx: Math.cos(angle)*AGENT_SPEED,
        vy: Math.sin(angle)*AGENT_SPEED,
        // Disease state
        state: 'healthy',   // healthy | incubating | symptomatic | recovered
        daysInState: 0,
        ticksInState: 0,
        // Logging
        stateLog: [],        // [{day, state}]
        testLog: [],         // [{day, result}] result = 'healthy'|'incubating'|'symptomatic'|'recovered'
        contactLog: [],      // logged only if followed
        // UI
        followed: false,
        name: _agentName(i),
      });
    }

    // Seed initial infections (3–5 agents)
    const seedCount = 3 + Math.floor(rng()*3);
    const shuffled = [...agents].sort(()=>rng()-0.5).slice(0,seedCount);
    for (const a of shuffled) {
      a.state = 'incubating';
      a.ticksInState = 0;
    }

    return {
      diff, seedStr, cfg, actual,
      diseasePool, agents,
      day: 1, tick: 0,
      actionsUsed: 0,
      actionsTotal: cfg.actions,
      quarantines: [],  // [{x,y,w,h}]
      dayHistory: [],   // [{day, symptomatic, recovered}]
      followed: [],     // agent ids being followed
      selectedDiseaseId: null,
    };
  }

  function _agentName(i) {
    const names=['Arlo','Bex','Cree','Dova','Emris','Fenn','Gael','Hira','Iven','Joss','Kade','Lemi','Mori','Neva','Orin','Pell','Quin','Rafe','Sela','Tavi','Uri','Vex','Wren','Xio','Yura','Zeph','Abra','Brin','Coda','Dex','Emi','Fox','Grael','Hext','Issa','Jax','Korra','Lev','Mora','Nox','Onyx','Pix','Quell','Ryn','Sov','Tyn','Ulm','Vel','Wex','Xan'];
    return names[i % names.length];
  }

  /* ── Navigation ─────────────────────────────────────────── */
  function goSetup() {
    stop();
    App.setBreadcrumb('Outbreak');
    App.showScreen('ob-setup');
    randSeed();
    document.querySelectorAll('#ob-diff-grid .diff-btn').forEach(b=>b.classList.toggle('sel',b.dataset.diff==='easy'));
  }

  function start() {
    stop();
    const diff = document.querySelector('#ob-diff-grid .diff-btn.sel').dataset.diff;
    let seed = document.getElementById('ob-seed-input').value.trim();
    if(!seed){seed=App.randSeedStr();document.getElementById('ob-seed-input').value=seed;}
    App.setSeed(seed);
    S = _freshState(diff, seed);
    _selectedDisease = null;
    _tool = 'observe';
    _playing = false;
    _speed = 1;
    _dragStart = _dragCur = null;
    App.showScreen('ob-game');
    _initCanvas();
    _renderSidebar();
    _renderUI();
    _rafLoop(performance.now());
  }

  function stop() {
    _playing = false;
    if (_raf) { cancelAnimationFrame(_raf); _raf=null; }
  }

  function randSeed() { document.getElementById('ob-seed-input').value = App.randSeedStr(); }

  /* ── Canvas init ─────────────────────────────────────────── */
  function _initCanvas() {
    const canvas = document.getElementById('ob-canvas');
    canvas.width  = CW;
    canvas.height = CH;

    canvas.onmousedown = _onMouseDown;
    canvas.onmousemove = _onMouseMove;
    canvas.onmouseup   = _onMouseUp;
    canvas.onclick     = _onClick;
  }

  function _canvasXY(e) {
    const r = document.getElementById('ob-canvas').getBoundingClientRect();
    return { x:(e.clientX-r.left)*(CW/r.width), y:(e.clientY-r.top)*(CH/r.height) };
  }

  /* ── Mouse handlers ──────────────────────────────────────── */
  function _onMouseDown(e) {
    if (_tool==='quarantine') {
      _dragStart = _canvasXY(e);
      _dragCur   = {..._dragStart};
      document.getElementById('ob-drag-hint').style.display='';
    }
  }
  function _onMouseMove(e) {
    if (_tool==='quarantine' && _dragStart) {
      _dragCur = _canvasXY(e);
    }
  }
  function _onMouseUp(e) {
    if (_tool==='quarantine' && _dragStart) {
      const p = _canvasXY(e);
      const x = Math.min(_dragStart.x,p.x), y=Math.min(_dragStart.y,p.y);
      const w = Math.abs(p.x-_dragStart.x), h=Math.abs(p.y-_dragStart.y);
      if (w>20&&h>20) _placeQuarantine(x,y,w,h);
      _dragStart=_dragCur=null;
      document.getElementById('ob-drag-hint').style.display='none';
    }
  }
  function _onClick(e) {
    const pos = _canvasXY(e);
    if (_tool==='quarantine') return; // handled by drag
    if (_tool==='remove-q') { _removeQuarantine(pos); return; }
    const agent = _agentAt(pos);
    if (!agent) return;
    if (_tool==='observe') _showAgentModal(agent);
    else if (_tool==='test') _testAgent(agent);
  }

  function _agentAt(pos) {
    let closest=null, minD=AGENT_R*2.5;
    for(const a of S.agents){
      const d=Math.hypot(a.x-pos.x,a.y-pos.y);
      if(d<minD){minD=d;closest=a;}
    }
    return closest;
  }

  /* ── Tools ───────────────────────────────────────────────── */
  function setTool(t) {
    _tool = t;
    _dragStart=_dragCur=null;
    ['observe','test','quarantine','remove-q'].forEach(id=>{
      const btn=document.getElementById('tool-'+id);
      if(btn) btn.className='btn'+(t===id?' active-tool':'');
    });
    document.getElementById('ob-tool-label').textContent =
      t==='observe'?'Tool: Follow agent':
      t==='test'?'Tool: Test agent (costs 1 action)':
      t==='quarantine'?'Tool: Drag to place quarantine (costs 1 action)':
      'Tool: Click quarantine to remove it (costs 1 action)';
    document.getElementById('ob-drag-hint').style.display='none';
  }

  function _placeQuarantine(x,y,w,h) {
    if (S.actionsUsed>=S.actionsTotal){ _notif('No actions remaining.','warn'); return; }
    S.quarantines.push({x,y,w,h});
    S.actionsUsed++;
    _renderUI();
    _notif('🚧 Quarantine placed. Agents cannot cross this boundary.','good');
  }

  function _removeQuarantine(pos) {
    if (S.actionsUsed>=S.actionsTotal){ _notif('No actions remaining.','warn'); return; }
    const idx = S.quarantines.findIndex(q=>pos.x>=q.x&&pos.x<=q.x+q.w&&pos.y>=q.y&&pos.y<=q.y+q.h);
    if (idx<0){ _notif('Click inside a quarantine zone to remove it.',''); return; }
    S.quarantines.splice(idx,1);
    S.actionsUsed++;
    _renderUI();
    _notif('Quarantine removed.','');
  }

  function _testAgent(agent) {
    if (S.actionsUsed>=S.actionsTotal){ _notif('No actions remaining.','warn'); return; }
    S.actionsUsed++;
    const result = agent.state; // reveal true state
    agent.testLog.push({day:S.day, result});
    // Also start following if not already
    if(!agent.followed){ agent.followed=true; S.followed.push(agent.id); }
    _renderUI();
    _renderFollowPanel();
    const stateStr = result==='incubating'?'⚠️ infected but not yet symptomatic':result==='healthy'?'✅ healthy':result==='symptomatic'?'🔴 symptomatic':'🔵 recovered';
    _notif(`🧪 Test result for ${agent.name}: ${stateStr}`, result==='incubating'?'warn':result==='healthy'?'good':'');
    App.closeModal('ob-agent-modal');
  }

  function _showAgentModal(agent) {
    document.getElementById('ob-agent-name').textContent = agent.name;
    const visState = agent.state==='incubating'?'appears healthy (incubating)':agent.state;
    document.getElementById('ob-agent-info').innerHTML =
      `<strong>Visible state:</strong> ${visState}<br>` +
      `<strong>Following:</strong> ${agent.followed?'Yes':'No'}<br>` +
      (agent.testLog.length>0?`<strong>Last test (day ${agent.testLog[agent.testLog.length-1].day}):</strong> ${agent.testLog[agent.testLog.length-1].result}`:'');

    // Timeline
    const tl = document.getElementById('ob-agent-timeline-wrap');
    tl.innerHTML='<div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px">State history (what you can observe):</div>';
    const tlRow = document.createElement('div'); tlRow.className='follow-timeline';
    for(const entry of agent.stateLog.slice(-14)){
      const d=document.createElement('div');
      const vis = entry.state==='incubating'?'healthy':entry.state; // only visible states
      d.className=`ft-day ${vis==='symptomatic'?'symptom':vis==='recovered'?'recovered':'healthy'}`;
      d.title=`Day ${entry.day}: ${vis}`; d.textContent=entry.day;
      tlRow.appendChild(d);
    }
    tl.appendChild(tlRow);

    const followBtn=document.getElementById('ob-agent-follow-btn');
    followBtn.textContent=agent.followed?'Unfollow':'Follow this agent';
    followBtn.onclick=()=>{
      agent.followed=!agent.followed;
      if(agent.followed&&!S.followed.includes(agent.id)) S.followed.push(agent.id);
      else if(!agent.followed) S.followed=S.followed.filter(id=>id!==agent.id);
      _renderFollowPanel();
      App.closeModal('ob-agent-modal');
    };
    App.showModal('ob-agent-modal');
  }

  /* ── Simulation ──────────────────────────────────────────── */
  function _rafLoop(now) {
    _raf = requestAnimationFrame(_rafLoop);
    const elapsed = now - _lastTick;
    const interval = TICK_MS / _speed;
    if (_playing && elapsed >= interval) {
      _lastTick = now;
      _simulateTick();
    }
    _draw();
  }

  function _simulateTick() {
    const d = S.actual;
    S.tick++;

    // Move agents
    for (const a of S.agents) {
      // Gentle random walk: nudge velocity slightly
      a.vx += (Math.random()-0.5)*0.3;
      a.vy += (Math.random()-0.5)*0.3;
      // Normalise speed
      const spd = Math.hypot(a.vx,a.vy);
      if(spd>AGENT_SPEED*1.5){a.vx=a.vx/spd*AGENT_SPEED*1.5;a.vy=a.vy/spd*AGENT_SPEED*1.5;}
      if(spd<AGENT_SPEED*0.5){a.vx=a.vx/spd*AGENT_SPEED*0.7;a.vy=a.vy/spd*AGENT_SPEED*0.7;}

      // Propose new position
      let nx=a.x+a.vx, ny=a.y+a.vy;

      // Bounce off canvas walls
      if(nx<AGENT_R){nx=AGENT_R;a.vx=Math.abs(a.vx);}
      if(nx>CW-AGENT_R){nx=CW-AGENT_R;a.vx=-Math.abs(a.vx);}
      if(ny<AGENT_R){ny=AGENT_R;a.vy=Math.abs(a.vy);}
      if(ny>CH-AGENT_R){ny=CH-AGENT_R;a.vy=-Math.abs(a.vy);}

      // Quarantine boundary collision
      for(const q of S.quarantines){
        const inQ  = nx>=q.x&&nx<=q.x+q.w&&ny>=q.y&&ny<=q.y+q.h;
        const wasInQ = a.x>=q.x&&a.x<=q.x+q.w&&a.y>=q.y&&a.y<=q.y+q.h;
        if(inQ&&!wasInQ){
          // Entering quarantine — bounce back
          if(nx<q.x||nx>q.x+q.w) a.vx=-a.vx;
          else a.vy=-a.vy;
          nx=a.x; ny=a.y;
        }
      }
      a.x=nx; a.y=ny;
    }

    // Transmission: symptomatic agents can infect healthy/recovered-no-immunity
    for(const inf of S.agents){
      if(inf.state!=='symptomatic'&&inf.state!=='incubating') continue;
      for(const sus of S.agents){
        if(sus.id===inf.id) continue;
        if(sus.state!=='healthy') continue;
        if(d.immunity&&sus.state==='recovered') continue;
        const dist=Math.hypot(inf.x-sus.x,inf.y-sus.y);
        if(dist<d.radius&&Math.random()<d.rate){
          sus.state='incubating';
          sus.ticksInState=0;
          sus.daysInState=0;
        }
      }
    }

    // Advance disease states
    for(const a of S.agents){
      if(a.state==='healthy'||a.state==='recovered') continue;
      a.ticksInState++;
      if(a.state==='incubating'&&a.ticksInState>=d.incubation*TICKS_PER_DAY){
        a.state='symptomatic'; a.ticksInState=0; a.daysInState=0;
      } else if(a.state==='symptomatic'&&a.ticksInState>=5*TICKS_PER_DAY){
        // Recovery after ~5 days of symptoms
        a.state=d.immunity?'recovered':'healthy';
        a.ticksInState=0; a.daysInState=0;
      }
    }

    // Advance day counter
    if(S.tick%TICKS_PER_DAY===0){
      S.day++;
      // Record state log for all agents
      for(const a of S.agents){
        a.stateLog.push({day:S.day, state:a.state});
      }
      // Record day history
      const symp=S.agents.filter(a=>a.state==='symptomatic').length;
      const rec =S.agents.filter(a=>a.state==='recovered').length;
      S.dayHistory.push({day:S.day,symptomatic:symp,recovered:rec});
      _renderUI();
      _renderFollowPanel();
      _renderChart();
    }
  }

  /* ── Time controls ───────────────────────────────────────── */
  function stepDay() {
    if(_playing) return;
    for(let i=0;i<TICKS_PER_DAY;i++) _simulateTick();
    _renderUI(); _renderFollowPanel(); _renderChart();
  }

  function togglePlay() {
    _playing=!_playing;
    document.getElementById('ob-play-btn').textContent=_playing?'⏸ Pause':'▶ Play';
    if(_playing) _lastTick=performance.now();
  }

  function setSpeed(s, btn) {
    _speed=s;
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',b.dataset.speed==s));
  }

  /* ── Diagnosis ───────────────────────────────────────────── */
  function selectDisease(id) {
    _selectedDisease=id;
    S.selectedDiseaseId=id;
    document.querySelectorAll('.disease-item').forEach(el=>el.classList.toggle('selected',el.dataset.id===id));
    document.getElementById('ob-diagnose-btn').disabled=false;
  }

  function submitDiagnosis() {
    if(!_selectedDisease){_notif('Select a disease first.','warn');return;}
    stop();
    const correct=_selectedDisease===S.actual.id;
    _showOutcome(correct);
  }

  function _showOutcome(correct) {
    App.showScreen('ob-success');
    const tier=_tier(S.actionsUsed);
    document.getElementById('ob-win-title').textContent=correct?'Correct diagnosis!':'Wrong diagnosis.';
    document.getElementById('ob-win-title').className='outcome-title '+(correct?'win':'fail');
    document.getElementById('ob-win-sub').textContent=correct
      ?`You correctly identified ${S.actual.name} using ${S.actionsUsed} action${S.actionsUsed!==1?'s':''}.`
      :`You guessed ${DISEASES.find(d=>d.id===_selectedDisease)?.name||'unknown'}, but it was ${S.actual.name}.`;

    if(correct) document.getElementById('ob-win-tier').innerHTML=`<span class="tier-badge ${tier}">${_tierLabel(tier)}</span>`;

    const symp=S.agents.filter(a=>a.state==='symptomatic'||a.state==='recovered'||a.stateLog.some(e=>e.state==='symptomatic')).length;
    document.getElementById('ob-win-stats').innerHTML=`
      <div class="stat-box"><div class="stat-v">${S.day}</div><div class="stat-l">Days observed</div></div>
      <div class="stat-box"><div class="stat-v">${S.actionsUsed}</div><div class="stat-l">Actions used</div></div>
      <div class="stat-box"><div class="stat-v">${symp}</div><div class="stat-l">Cases total</div></div>`;

    // Disease reveal table
    const table=document.getElementById('ob-reveal-table');
    table.innerHTML=`<tr><th>Disease</th><th>Radius</th><th>Rate</th><th>Incubation</th><th>Immunity</th></tr>`;
    for(const d of DISEASES.filter(d=>S.cfg.diseases.includes(d.id))){
      const isActual=d.id===S.actual.id;
      const isGuessed=d.id===_selectedDisease&&!isActual;
      const tr=document.createElement('tr');
      if(isActual) tr.className='actual';
      else if(isGuessed) tr.className='guessed';
      tr.innerHTML=`<td>${isActual?'✔ ':''}${d.name}</td><td>${d.radius<25?'tight':d.radius<45?'medium':'wide'}</td><td>${d.rate<0.008?'low':d.rate<0.015?'medium':'high'}</td><td>${d.incubation} days</td><td>${d.immunity?'Yes':'No'}</td>`;
      table.appendChild(tr);
    }

    document.getElementById('ob-win-reflect').innerHTML=_reflectText(correct,tier);
  }

  function _reflectText(correct,tier){
    const actual=S.actual;
    return `<strong>💭 For reflection</strong>
      The disease was <strong>${actual.name}</strong> — ${actual.desc.toLowerCase()}.
      <br><br>
      ${correct?`You identified it${tier==='gold'?' with remarkable efficiency':tier==='silver'?' efficiently':' — though it took more actions than necessary'}.`:'You made the wrong diagnosis. Look at the table above — how is the actual disease different from your guess?'}
      <br><br>
      <strong>What each parameter tells you, if you look carefully:</strong><br>
      <em>Transmission radius</em>: how quickly transmission spreads across the community. Wide-radius diseases reach people across the space; tight ones require close contact.<br>
      <em>Rate</em>: how steep the early symptom curve is.<br>
      <em>Incubation</em>: the gap between initial spread and visible symptoms. Long incubation means the disease looks quiet even as it spreads.<br>
      <em>Immunity</em>: whether recovered agents re-enter the susceptible pool. No immunity means the outbreak can smolder indefinitely.
      <br><br>
      Notice what you could have learned earlier with more strategic testing — and what required actually intervening (quarantine) rather than just watching.`;
  }

  /* ── Render ──────────────────────────────────────────────── */
  function _renderUI() {
    document.getElementById('ob-day').textContent=S.day;
    const symp=S.agents.filter(a=>a.state==='symptomatic').length;
    const rec =S.agents.filter(a=>a.state==='recovered').length;
    document.getElementById('ob-symptomatic').textContent=symp;
    document.getElementById('ob-recovered').textContent=rec;
    document.getElementById('ob-actions').textContent=S.actionsTotal-S.actionsUsed;
    const tier=_tier(S.actionsUsed);
    document.getElementById('ob-tier-badge').innerHTML=`<span class="tier-badge ${tier}">${_tierLabel(tier)}</span>`;

    // Action pips
    const track=document.getElementById('ob-action-track'); track.innerHTML='';
    for(let i=0;i<S.actionsTotal;i++){
      const p=document.createElement('div');
      p.className='a-pip'+(i<S.actionsUsed?' used':'');
      track.appendChild(p);
    }
  }

  function _renderSidebar() {
    const list=document.getElementById('ob-disease-list'); list.innerHTML='';
    for(const d of DISEASES.filter(d=>S.cfg.diseases.includes(d.id))){
      const item=document.createElement('div');
      item.className='disease-item'; item.dataset.id=d.id;
      item.innerHTML=`<div class="disease-dot" style="background:${d.color}"></div><div><div class="disease-name">${d.name}</div><div class="disease-hint">${d.desc}</div></div>`;
      item.onclick=()=>selectDisease(d.id);
      list.appendChild(item);
    }
  }

  function _renderFollowPanel() {
    const followed=S.agents.filter(a=>a.followed);
    const card=document.getElementById('ob-follow-card');
    if(!followed.length){card.style.display='none';return;}
    card.style.display='';
    const list=document.getElementById('ob-follow-list'); list.innerHTML='';
    for(const a of followed){
      const entry=document.createElement('div'); entry.className='follow-entry';
      const name=document.createElement('div'); name.className='follow-name';
      const dot=document.createElement('div');
      dot.style.cssText=`width:10px;height:10px;border-radius:50%;background:${a.state==='symptomatic'?C_SYMPTOM:a.state==='recovered'?C_RECOVERED:C_HEALTHY}`;
      name.appendChild(dot);
      name.appendChild(document.createTextNode(a.name));
      // Test badge if tested
      if(a.testLog.length>0){
        const tb=document.createElement('span');
        tb.style.cssText='font-size:9px;background:rgba(74,144,64,0.15);color:var(--leaf-dark);padding:1px 5px;border-radius:8px;margin-left:4px';
        tb.textContent='tested';
        name.appendChild(tb);
      }
      entry.appendChild(name);

      // Timeline strip (last 14 days)
      const tl=document.createElement('div'); tl.className='follow-timeline';
      const log=a.stateLog.slice(-14);
      for(const e of log){
        const d=document.createElement('div');
        // Tests override visible state
        const test=a.testLog.find(t=>t.day===e.day);
        const dispState=test?test.result:(e.state==='incubating'?'healthy':e.state);
        d.className=`ft-day ${dispState==='symptomatic'?'symptom':dispState==='recovered'?'recovered':test&&dispState==='incubating'?'tested-inc':test?'tested-ok':'healthy'}`;
        d.title=`Day ${e.day}: ${test?test.result+' (tested)':dispState}`;
        d.textContent=e.day<=9?e.day:'·';
        tl.appendChild(d);
      }
      entry.appendChild(tl);
      list.appendChild(entry);
    }
  }

  function _renderChart() {
    const canvas=document.getElementById('ob-chart-canvas');
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,270,70);
    if(!S.dayHistory.length) return;
    const maxCount=Math.max(1,...S.dayHistory.map(e=>e.symptomatic+e.recovered));
    const dx=270/Math.max(S.dayHistory.length,1);
    ctx.beginPath();
    for(let i=0;i<S.dayHistory.length;i++){
      const x=i*dx, y=70*(1-S.dayHistory[i].symptomatic/maxCount);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle='#6aaa5a'; ctx.lineWidth=2; ctx.stroke();

    ctx.beginPath();
    for(let i=0;i<S.dayHistory.length;i++){
      const x=i*dx, y=70*(1-S.dayHistory[i].recovered/maxCount);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle='#7080b0'; ctx.lineWidth=2; ctx.stroke();
  }

  /* ── Canvas draw ─────────────────────────────────────────── */
  function _draw() {
    const canvas=document.getElementById('ob-canvas');
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,CW,CH);

    // Background
    ctx.fillStyle='#0e1a2e'; ctx.fillRect(0,0,CW,CH);
    // Subtle grid
    ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
    for(let x=0;x<CW;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,CH);ctx.stroke();}
    for(let y=0;y<CH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke();}

    // Quarantine zones
    for(const q of S.quarantines){
      ctx.fillStyle=C_QZONE; ctx.fillRect(q.x,q.y,q.w,q.h);
      ctx.strokeStyle=C_QZONE_BORDER; ctx.lineWidth=2; ctx.setLineDash([6,3]);
      ctx.strokeRect(q.x,q.y,q.w,q.h); ctx.setLineDash([]);
      ctx.fillStyle='rgba(200,80,40,0.55)'; ctx.font='bold 10px Nunito,sans-serif'; ctx.textAlign='center';
      ctx.fillText('QUARANTINE',q.x+q.w/2,q.y+q.h/2);
    }

    // Drag preview
    if(_dragStart&&_dragCur){
      const x=Math.min(_dragStart.x,_dragCur.x),y=Math.min(_dragStart.y,_dragCur.y);
      const w=Math.abs(_dragCur.x-_dragStart.x),h=Math.abs(_dragCur.y-_dragStart.y);
      ctx.fillStyle='rgba(200,80,40,0.12)'; ctx.fillRect(x,y,w,h);
      ctx.strokeStyle='rgba(200,80,40,0.8)'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
      ctx.strokeRect(x,y,w,h); ctx.setLineDash([]);
    }

    // Transmission radius preview for followed agents (faint ring)
    for(const id of S.followed){
      const a=S.agents.find(x=>x.id===id);
      if(!a) continue;
      ctx.beginPath(); ctx.arc(a.x,a.y,S.actual.radius,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.stroke();
    }

    // Agents
    for(const a of S.agents){
      // Visible state (incubating looks healthy)
      const visState=a.state==='incubating'?'healthy':a.state;
      const col=visState==='healthy'?C_HEALTHY:visState==='symptomatic'?C_SYMPTOM:C_RECOVERED;

      // Follow ring
      if(a.followed){
        ctx.beginPath(); ctx.arc(a.x,a.y,AGENT_R+3.5,0,Math.PI*2);
        ctx.strokeStyle=C_FOLLOW_RING; ctx.lineWidth=1.5; ctx.stroke();
      }

      // Body
      ctx.beginPath(); ctx.arc(a.x,a.y,AGENT_R,0,Math.PI*2);
      ctx.fillStyle=col; ctx.fill();

      // Subtle inner highlight
      ctx.beginPath(); ctx.arc(a.x-AGENT_R*0.28,a.y-AGENT_R*0.28,AGENT_R*0.35,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.fill();
    }

    // Day label
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='bold 11px Nunito,sans-serif'; ctx.textAlign='right';
    ctx.fillText(`Day ${S.day}`,CW-8,CH-8);
  }

  /* ── Notification ────────────────────────────────────────── */
  function _notif(html,type){
    const el=document.getElementById('ob-notif');
    el.className='notif vis'+(type==='good'?' good':type==='warn'?' warn':'');
    el.innerHTML=html;
  }

  /* ── Landing art animation ──────────────────────────────── */
  function _initLandingArt() {
    const canvas=document.getElementById('land-ob-canvas');
    if(!canvas) return;
    const W=canvas.offsetWidth||290, H=150;
    canvas.width=W; canvas.height=H;
    const ctx=canvas.getContext('2d');

    // Mini simulation with a few dots
    const dots=[];
    for(let i=0;i<25;i++){
      const state=i<3?'symptomatic':i<6?'incubating':'healthy';
      dots.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.8,vy:(Math.random()-0.5)*0.8,state});
    }
    function drawLanding(){
      ctx.fillStyle='#0e1a2e'; ctx.fillRect(0,0,W,H);
      for(const d of dots){
        d.x+=d.vx; d.y+=d.vy;
        if(d.x<3||d.x>W-3){d.vx=-d.vx;d.x=Math.max(3,Math.min(W-3,d.x));}
        if(d.y<3||d.y>H-3){d.vy=-d.vy;d.y=Math.max(3,Math.min(H-3,d.y));}
        ctx.beginPath(); ctx.arc(d.x,d.y,4,0,Math.PI*2);
        ctx.fillStyle=d.state==='symptomatic'?C_SYMPTOM:d.state==='incubating'?C_INCUBATE:C_HEALTHY;
        ctx.fill();
      }
      requestAnimationFrame(drawLanding);
    }
    drawLanding();
  }

  return {
    goSetup, start, stop, randSeed,
    stepDay, togglePlay, setSpeed,
    setTool, selectDisease, submitDiagnosis,
    _initLandingArt,
  };
})();

  const msg = String(e.message || '');
  if (msg.includes('Unsafe attempt to load URL') || msg.includes('file: URLs are treated as unique security origins')) {
    const n = document.getElementById('pf-notif');
    if (n) {
      n.className = 'notif vis warn';
      n.innerHTML = 'The browser blocked a local-file navigation. This build no longer relies on external mode files; if this reappears, open the HTML from a normal folder and avoid nested file previews.';
    }
  }
}, true);
